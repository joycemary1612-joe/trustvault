# Render blueprint: one PostgreSQL database + one web service that serves the
# API and the built React app. No secret is typed by hand: Render passes the
# database's internal address to the app and generates the audit key.
databases:
  - name: trustvault-db
    plan: free
    region: singapore
    databaseName: trustvault
    user: trustvault
    ipAllowList: []          # no access from the internet; only Render services can connect

services:
  - type: web
    name: trustvault
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString   # internal address, never leaves Render's network
      - key: AUDIT_HMAC_KEY
        generateValue: true             # random secret, kept only in the app's environment
